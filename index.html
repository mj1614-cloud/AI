imation:up .18s ease-out;max-height:92vh;overflow:auto}@keyframes up{from{transform:translateY(24px);opacity:.7}to{transform:translateY(0);opacity:1}}.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.sheet h2{font-size:19px;margin:0;letter-spacing:-.5px}.close{border:0;background:#f3f4f6;width:34px;height:34px;border-radius:50%;font-size:20px;color:#667085}.field-label{display:block;font-size:12px;font-weight:700;color:#4b5563;margin:17px 0 8px}.field{width:100%;height:50px;border:1px solid #d1d5db;border-radius:11px;padding:0 14px;font-size:15px;color:var(--ink);outline:none}.field:focus{border:2px solid var(--blue)}.field::placeholder{color:#a0a6b1}.amount-wrap{position:relative}.amount-wrap .field{padding-right:45px;font-size:20px;font-weight:700}.won{position:absolute;right:15px;top:14px;color:#707887;font-weight:600}.helper{font-size:11px;color:#9ca3af;margin-top:7px}.payer-toggle{display:flex;background:#f3f4f6;padding:4px;border-radius:11px;gap:3px}.payer-toggle button{border:0;background:transparent;border-radius:8px;flex:1;height:38px;color:#737b89;font-size:13px;font-weight:600}.payer-toggle button.selected{background:#fff;color:var(--ink);box-shadow:0 0 0 1px #e5e7eb}.sheet-footer{display:flex;gap:9px;margin-top:25px}.sheet-footer button{flex:1;height:48px}.danger{background:#fee2e2;color:#dc2626}.confirm-copy{color:#626b7a;font-size:14px;line-height:1.7;margin:12px 0 22px}.confirm-amount{color:var(--blue);font-weight:800}.history-head{display:flex;align-items:center;gap:12px;margin-bottom:24px}.back{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:18px}.history-title{font-size:21px;font-weight:750}.history-card{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}.history-main{padding:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.history-date{font-size:13px;color:#667085}.history-total{font-size:15px;font-weight:700;margin-top:6px}.badge{background:#ecfdf5;color:#047857;border-radius:30px;padding:6px 9px;font-size:11px;font-weight:700}.history-details{display:none;padding:0 16px 15px;border-top:1px solid #f1f2f4}.history-card.expanded .history-details{display:block}.history-details p{font-size:12px;color:#7b8492;margin:12px 0 8px}.history-item{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;color:#525c6b}.history-empty{text-align:center;color:#9ca3af;padding:60px 10px;font-size:14px}.view{display:none}.view.active{display:block}.view.history{min-height:75vh}
    @media(max-width:760px){body{background:#fff}.shell{display:block}.sidebar{display:none}.main{padding:22px 20px calc(100px + env(safe-area-inset-bottom));max-width:520px}.topline{margin-bottom:28px}.hello{align-items:start}.hello h1{font-size:23px}.hello p{font-size:13px}.invite-mini{display:none}.summary{padding:20px;margin-bottom:20px}.total{font-size:32px}.balance-row{align-items:flex-start;flex-direction:column}.summary-actions{width:100%}.summary-actions .btn{flex:1}.invite-banner{align-items:flex-start;flex-direction:column;padding:14px;margin-bottom:28px}.invite-actions{width:100%}.invite-actions button{flex:1}.sticky{display:block;position:fixed;bottom:0;left:0;right:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:#ffffffed;border-top:1px solid #eef0f4;backdrop-filter:blur(12px);z-index:10}.sticky .btn{width:100%;height:52px;font-size:15px;border-radius:13px}.overlay{padding:0;align-items:flex-end}.sheet{border-radius:22px 22px 0 0;padding:23px 22px calc(22px + env(safe-area-inset-bottom));width:100%}.history-view .sticky{display:none}.history-head{margin-bottom:25px}.toast{bottom:calc(82px + env(safe-area-inset-bottom))}}
    @media(min-width:761px) and (max-width:1050px){.main{padding:32px 34px}}

<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">ㅁ</span>모아</div>
      <div class="nav-label">WORKSPACE</div>
      <div class="nav-item active"><span class="nav-icon">▤</span>이번 정산</div>
      <div class="nav-item" id="sideHistory"><span class="nav-icon">◷</span>지난 정산 내역</div>
      <div class="sidebar-bottom">
        <div class="room-card"><div class="room-label">함께 쓰는 방</div><div class="room-name"><span class="room-dot"></span><span id="sideRoom">우리집 정산방</span></div></div>
        <div class="profile"><div class="avatar">서</div><div><div class="profile-name">김서연</div><div class="profile-sub">정산 방장</div></div></div>
      </div>
    </aside>
    <main class="main">
      <div class="topline"><div class="crumb">생활비 관리 <span style="margin:0 7px;color:#c2c7d0">/</span> <b id="crumbRoom">우리집 정산방</b></div><div class="top-actions"><button class="period" id="periodBtn">이번 주기⌄</button><button class="icon-btn" id="inviteTop" aria-label="초대 링크">↗</button></div></div>
      <section class="view active" id="homeView">
        <div class="hello"><div><div class="eyebrow">우리 둘의 생활비</div><h1>이번 달도 가볍게,<br>함께 정산해요</h1><p>작은 지출도 빠짐없이 모아볼까요?</p></div><button class="invite-mini" id="inviteTop2">↗ 룸메이트 초대</button></div>
        <div class="summary">
          <div class="sum-head"><span class="sum-caption">이번 주기 총 지출</span><span class="period-small" id="periodLabel">11월 1일 이후</span></div>
          <div class="total" id="totalAmount">0원</div><div class="sum-divider"></div>
          <div class="balance-row"><div class="balance-copy" id="balanceText">현재 주고받을 금액이 없어요 <span class="amount">(0원)</span></div><div class="summary-actions"><button class="btn btn-outline" id="copyBtn">차액 복사</button><button class="btn btn-primary" id="settleBtn">정산 완료</button></div></div>
        </div>
        <div class="invite-banner" id="inviteBanner"><div class="invite-text"><strong>룸메이트와 함께 관리해요</strong>초대 링크를 보내면 지출 내역을 같이 확인할 수 있어요.</div><div class="invite-actions"><button class="btn-small" id="shareBtn">카톡 초대</button><button class="btn-small" id="copyLinkBtn">링크 복사</button></div></div>
        <div class="section-head"><h2>이번 주기 지출 <span class="count" id="expenseCount">0건</span></h2><button class="text-btn" id="sortBtn">최근 등록순⌄</button></div>
        <div class="list" id="expenseList"></div>
      </section>
      <section class="view history-view" id="historyView"><div class="history-head"><button class="back" id="backBtn">‹</button><div class="history-title">지난 정산 내역</div></div><div id="historyList"></div></section>
    </main>
  </div>
  <div class="sticky" id="sticky"><button class="btn btn-primary" id="addBtn">＋ 지출 등록</button></div>
  <div class="overlay" id="expenseOverlay"><div class="sheet"><div class="sheet-top"><h2 id="formTitle">내가 결제한 지출 기록</h2><button class="close" data-close="expenseOverlay">×</button></div><label class="field-label" for="itemName">항목명</label><input class="field" id="itemName" maxlength="20" placeholder="예) 휴지, 전기세" autocomplete="off"><label class="field-label" for="itemAmount">금액</label><div class="amount-wrap"><input class="field" id="itemAmount" inputmode="numeric" placeholder="0" maxlength="11"><span class="won">원</span></div><div class="helper">공동 지출 항목과 결제 금액을 입력해 주세요.</div><label class="field-label">누가 결제했나요?</label><div class="payer-toggle"><button class="selected" data-payer="김서연">김서연</button><button data-payer="이지수">이지수</button></div><div class="sheet-footer" id="formActions"><button class="btn btn-primary" id="saveExpense">등록하기</button></div></div></div>
  <div class="overlay" id="settleOverlay"><div class="sheet"><div class="sheet-top"><h2>정산을 완료할까요?</h2><button class="close" data-close="settleOverlay">×</button></div><p class="confirm-copy" id="confirmCopy"></p><div class="sheet-footer"><button class="btn" style="background:#f3f4f6;color:#374151" data-close="settleOverlay">취소</button><button class="btn btn-primary" id="confirmSettle">정산 완료</button></div></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const KEY='moa-household-v1';
    const seed={room:'우리집 정산방',member2:true,invite:'moa.app/invite/room-82kq',expenses:[
      {id:'e1',name:'전기세',amount:28400,payer:'김서연',date:'2026-11-24T19:20:00'},
      {id:'e2',name:'세탁세제',amount:12900,payer:'이지수',date:'2026-11-22T14:05:00'},
      {id:'e3',name:'휴지 30롤',amount:18900,payer:'김서연',date:'2026-11-20T18:42:00'},
      {id:'e4',name:'종량제 봉투',amount:5600,payer:'이지수',date:'2026-11-18T11:12:00'}],history:[]};
    let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{state=structuredClone(seed)}
    let editing=null,payer='김서연',ascending=false;
    const $=id=>document.getElementById(id), won=n=>`${Number(n).toLocaleString('ko-KR')}원`, save=()=>localStorage.setItem(KEY,JSON.stringify(state));
    function totals(){let a=0,b=0;state.expenses.forEach(e=>e.payer==='김서연'?a+=e.amount:b+=e.amount);return{sum:a+b,diff:a-b,a,b}}
    function render(){ $('crumbRoom').textContent=state.room;$('sideRoom').textContent=state.room;$('totalAmount').textContent=won(totals().sum);$('expenseCount').textContent=`${state.expenses.length}건`;let {diff}=totals();$('balanceText').className='balance-copy'+(diff===0?' settled':'');$('balanceText').innerHTML=diff===0?'현재 주고받을 금액이 없어요 <span class="amount">(0원)</span>':diff>0?`<strong>이지수님이 김서연님에게</strong> <span class="amount">${won(Math.floor(diff/2))}</span> 보내기`:`<strong>김서연님이 이지수님에게</strong> <span class="amount">${won(Math.floor(-diff/2))}</span> 보내기`;
      let rows=[...state.expenses].sort((a,b)=>ascending?new Date(a.date)-new Date(b.date):new Date(b.date)-new Date(a.date));$('expenseList').innerHTML=rows.length?rows.map(e=>`<div class="expense" data-id="${e.id}"><div class="exp-left"><div class="exp-title">${esc(e.name)}</div><div class="exp-meta">${e.payer} · ${dateLabel(e.date)}</div></div><div class="exp-right"><div class="exp-amount">${won(e.amount)}</div><div class="exp-split ${e.payer==='김서연'?'owed':''}">${e.payer==='김서연'?'내가 결제':'지수가 결제'}</div></div></div>`).join(''):`<div class="empty">아직 등록된 지출이 없어요.<br>아래 버튼을 눌러 첫 내역을 기록해 보세요!</div>`;
      document.querySelectorAll('.expense').forEach(el=>el.onclick=()=>openExpense(el.dataset.id));renderHistory();}
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateLabel(d){let x=new Date(d),now=new Date(),same=x.toDateString()===now.toDateString();return same?`오늘 ${x.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}`:`${x.getMonth()+1}월 ${x.getDate()}일`}
    let toastTimer;function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2300)}
    function open(id){$(id).classList.add('open')}function close(id){$(id).classList.remove('open')}
    function openExpense(id){editing=id||null;let e=state.expenses.find(x=>x.id===id);$('formTitle').textContent=e?'지출 내역 수정':'내가 결제한 지출 기록';$('itemName').value=e?.name||'';$('itemAmount').value=e?Number(e.amount).toLocaleString('ko-KR'):'';payer=e?.payer||'김서연';document.querySelectorAll('[data-payer]').forEach(b=>b.classList.toggle('selected',b.dataset.payer===payer));$('formActions').innerHTML=e?'<button class="btn danger" id="deleteExpense">삭제</button><button class="btn btn-primary" id="saveExpense">수정 완료</button>':'<button class="btn btn-primary" id="saveExpense">등록하기</button>';bindSave();open('expenseOverlay');setTimeout(()=>$('itemName').focus(),100)}
    function bindSave(){$('saveExpense').onclick=()=>{let name=$('itemName').value.trim(),amount=Number($('itemAmount').value.replace(/\D/g,''));if(!name)return toast('항목명을 1자 이상 입력해 주세요.');if(name.length>20)return toast('항목명은 최대 20자까지 입력할 수 있습니다.');if(!amount)return toast('금액은 1원 이상 입력해 주세요.');if(amount>99999999)return toast('1회 최대 입력 가능 금액은 9,999만 원입니다.');if(editing){let e=state.expenses.find(x=>x.id===editing);Object.assign(e,{name,amount,payer})}else state.expenses.push({id:crypto.randomUUID(),name,amount,payer,date:new Date().toISOString()});save();close('expenseOverlay');render();toast(editing?'내역을 수정했어요.':'지출을 등록했어요.')};let del=$('deleteExpense');if(del)del.onclick=()=>{state.expenses=state.expenses.filter(x=>x.id!==editing);save();close('expenseOverlay');render();toast('지출 내역을 삭제했어요.')}}
    function renderHistory(){$('historyList').innerHTML=state.history.length?state.history.map((h,i)=>`<div class="history-card"><div class="history-main" data-history="${i}"><div><div class="history-date">${h.date} 정산 완료 · ${esc(h.by)} 처리</div><div class="history-total">총 지출 ${won(h.total)}</div></div><span class="badge">완료</span></div><div class="history-details"><p>최종 차액 ${won(h.diff)} · ${h.expenses.length}건</p>${h.expenses.map(e=>`<div class="history-item"><span>${esc(e.name)} · ${esc(e.payer)}</span><b>${won(e.amount)}</b></div>`).join('')}</div></div>`).join(''):'<div class="history-empty">아직 완료된 정산 내역이 없어요.</div>';document.querySelectorAll('[data-history]').forEach(el=>el.onclick=()=>el.parentElement.classList.toggle('expanded'))}
    function showHistory(on){$('homeView').classList.toggle('active',!on);$('historyView').classList.toggle('active',on);$('sticky').style.display=on?'none':'';document.body.classList.toggle('history-view',on)}
    $('addBtn').onclick=()=>openExpense();$('sideHistory').onclick=()=>showHistory(true);$('backBtn').onclick=()=>showHistory(false);$('sortBtn').onclick=()=>{ascending=!ascending;$('sortBtn').textContent=ascending?'오래된 순⌄':'최근 등록순⌄';render()};
    $('itemAmount').addEventListener('input',e=>{let n=e.target.value.replace(/\D/g,'').slice(0,8);e.target.value=n?Number(n).toLocaleString('ko-KR'):''});document.querySelectorAll('[data-payer]').forEach(b=>b.onclick=()=>{payer=b.dataset.payer;document.querySelectorAll('[data-payer]').forEach(x=>x.classList.toggle('selected',x===b))});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)close(o.id)});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay.open').forEach(o=>close(o.id))});
    $('copyBtn').onclick=async()=>{let{diff}=totals();if(!state.member2)return toast('룸메이트가 입장하면 정산할 수 있어요.');if(!diff)return toast('현재 주고받을 금액이 없어요.');let text=diff>0?`${state.room} 이지수님이 김서연님에게 ${won(Math.floor(diff/2))} 보내기`:`${state.room} 김서연님이 이지수님에게 ${won(Math.floor(-diff/2))} 보내기`;await copy(text);toast('정산 차액 안내 문구가 복사되었습니다.')};
    $('settleBtn').onclick=()=>{let{diff,sum}=totals();if(!state.member2)return toast('룸메이트가 입장하면 정산할 수 있어요.');if(!sum)return toast('정산할 차액이 0원입니다. 지출 내역을 먼저 등록해 주세요.');if(!diff)return toast('현재 주고받을 금액이 없어요.');$('confirmCopy').innerHTML=`현재 차액 <span class="confirm-amount">${won(Math.floor(Math.abs(diff)/2))}</span>이 0원으로 초기화되고,<br>이전 내역은 지난 정산 내역에 보관됩니다.`;open('settleOverlay')};
    $('confirmSettle').onclick=()=>{let{sum,diff}=totals();state.history.unshift({date:new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\s/g,''),by:'김서연님',total:sum,diff:Math.floor(Math.abs(diff)/2),expenses:structuredClone(state.expenses)});state.expenses=[];save();close('settleOverlay');render();toast('정산이 완료되었어요.')};
    async function copy(text){try{await navigator.clipboard.writeText(text)}catch{let t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}}
    async function invite(){await copy(`모아에서 같이 생활비 정산해요! ${state.invite}`);toast('초대 링크를 복사했어요. 카카오톡으로 공유해 보세요.')}['inviteTop','inviteTop2','copyLinkBtn','shareBtn'].forEach(id=>$(id).onclick=invite);$('periodBtn').onclick=()=>toast('이번 정산 주기 내역을 보고 있어요.');render();
  </script>
</body>
</html>
